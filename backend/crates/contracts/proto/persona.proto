syntax = "proto3";
package waifu.v1;
import "common.proto";
import "memory.proto";

service Persona {
  rpc Get(Empty) returns (PersonaInfo);
  rpc BuildPrompt(BuildPromptRequest) returns (BuildPromptResponse);
  // Emits a PersonaInfo every time persona.yaml changes on disk (hot reload).
  rpc Watch(Empty) returns (stream PersonaInfo);
}

message PersonaInfo {
  string name = 1;
  uint32 age = 2;
  string greeting = 3;
  string voice = 4;
  string avatar = 5;
  string language = 6;
  repeated string emotions = 7;
  uint64 version = 8;
}
message BuildPromptRequest {
  string user_name = 1;
  string summary = 2;
  repeated Fact facts = 3;
  repeated MemoryItem memories = 4;
  string current_emotion = 5;
}
message BuildPromptResponse { string system_prompt = 1; PersonaInfo info = 2; }



