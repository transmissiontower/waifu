[package]
name = "tts-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sherpa", "sherpa-download"]
# Local neural TTS (Piper / Kokoro) through sherpa-onnx. Disable for a babble-only build.
sherpa = ["dep:sherpa-rs"]
# Let the build script download prebuilt sherpa-onnx. Without it, set SHERPA_LIB_PATH to a local copy.
sherpa-download = ["sherpa-rs/download-binaries"]

[dependencies]
common.workspace = true
contracts.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
serde.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
anyhow.workspace = true
sherpa-rs = { version = "0.6.8", optional = true, default-features = false, features = ["tts"] }
