<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starting…</title>
<style>
  :root { color-scheme: dark; --bg:#14121c; --panel:rgba(22,20,34,.78); --fg:#f1eef8; --accent:#ff8fb8; --muted:#a9a3bd; --ok:#5fd38d; --warn:#f0b429; --bad:#e5484d; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background: radial-gradient(circle at 50% 25%, #2b2440, var(--bg)); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 36px 22px 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); }
  #sub { color: var(--muted); margin: 0 0 18px; min-height: 1.4em; }
  .bar { height: 8px; border-radius: 6px; background:#ffffff1a; overflow:hidden; margin-bottom: 20px; }
  .bar > i { display:block; height:100%; width:0; background: var(--accent); border-radius: 6px; transition: width .4s ease; }
  .bar.indet > i { width: 35% !important; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
  ul { list-style:none; margin:0; padding:0; }
  .step { display:flex; gap:10px; padding:7px 0; align-items:flex-start; }
  .ico { width:20px; text-align:center; flex:none; }
  .step .t { flex:1; min-width:0; }
  .step .d { color: var(--muted); font-size: 13px; overflow-wrap:anywhere; }
  .pending { opacity:.45; } .active .ico { color: var(--accent); animation: pulse 1.1s infinite; } .done .ico { color: var(--ok); } .error .ico { color: var(--bad); }
  @keyframes pulse { 50% { opacity:.35; } }
  #svc { margin: 6px 0 4px 30px; }
  #svc li { display:flex; gap:8px; font-size:13.5px; padding:2px 0; }
  #svc .n { flex:1; } #svc .s { color: var(--muted); }
  #svc .ready .s { color: var(--ok); } #svc .loading .s, #svc .starting .s, #svc .restarting .s { color: var(--accent); } #svc .degraded .s { color: var(--warn); } #svc .failed .s { color: var(--bad); }
  #svc .why { color: var(--muted); font-size:12.5px; margin-left:0; }
  #err { display:none; margin-top:18px; padding:12px 14px; border-radius:10px; background:#e5484d22; border:1px solid #e5484d66; }
  #err b { color: var(--bad); }
  pre { margin:10px 0 0; max-height: 150px; overflow:auto; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  #log { margin-top: 18px; opacity:.8; }
</style>
</head>
<body>
<main>
  <h1 id="title">Starting…</h1>
  <p id="sub">Getting everything ready</p>
  <div class="bar indet" id="bar"><i></i></div>
  <ul id="steps"></ul>
  <ul id="svc"></ul>
  <div id="err"><b>Something went wrong.</b> <span id="errmsg"></span><pre id="errlog"></pre></div>
  <pre id="log"></pre>
</main>
<script>
const STEPS = [
  { id: 'build', label: 'Compiling the engine' },
  { id: 'models', label: 'Downloading models' },
  { id: 'frontend', label: 'Building the interface' },
  { id: 'services', label: 'Starting services' },
];
const DONE_STATES = ['ready', 'degraded', 'failed'];
const STATE_TEXT = { starting: 'starting…', loading: 'loading…', ready: 'ready', degraded: 'limited', failed: 'failed', restarting: 'restarting…' };

/** Pure: raw /status JSON -> everything the page shows. */
function view(st) {
  st = st || {};
  const sv = st.services || null;
  let phase = st.phase || (sv ? 'services' : 'build');
  if (sv && sv.overall === 'ready') phase = 'ready';
  const list = sv && Array.isArray(sv.services) ? sv.services : [];
  const done = list.filter((s) => DONE_STATES.includes(s.state)).length;
  const ready = phase === 'ready';
  let idx = ready ? STEPS.length : STEPS.findIndex((s) => s.id === phase);
  if (idx < 0) idx = 0;
  const err = st.error || '';
  const detail = {
    build: st.compiled > 0 ? `${st.compiled} crates compiled` + (st.crate ? ` · now ${st.crate}` : '')
      : st.downloaded > 0 ? `${st.downloaded} crates downloaded` : (st.detail || 'Checking what needs to be built…'),
    models: st.detail || '',
    frontend: st.detail || '',
    services: list.length ? `${done} of ${list.length} ready` : (st.detail || ''),
  };
  const steps = STEPS.map((s, i) => ({
    id: s.id, label: s.label,
    state: i < idx ? 'done' : i === idx ? (err ? 'error' : 'active') : 'pending',
    detail: i === idx ? detail[s.id] : '',
  }));
  const frac = phase === 'services' && list.length ? done / list.length : 0.4;
  const name = st.name || '';
  return {
    title: ready ? `${name || 'Ready'}${name ? ' is ready' : ''}` : `Waking up ${name || 'the app'}…`,
    subtitle: err ? 'Start-up stopped' : ready ? 'Opening…' : (STEPS[idx] ? STEPS[idx].label : ''),
    steps,
    services: phase === 'services' || ready ? list.map((s) => ({ label: s.label, state: s.state, text: STATE_TEXT[s.state] || s.state, detail: s.detail || '' })) : [],
    percent: ready ? 100 : Math.round(((idx + frac) / STEPS.length) * 100),
    indeterminate: !ready && !(phase === 'services' && list.length) && !err,
    ready, error: err, url: sv && sv.url ? sv.url : '',
    tail: Array.isArray(st.tail) ? st.tail : [],
  };
}

if (typeof document !== 'undefined') {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  const ICON = { done: '✓', active: '●', pending: '○', error: '✕' };
  let redirected = false, misses = 0;

  function render(v) {
    $('title').textContent = v.title;
    document.title = v.title;
    $('sub').textContent = v.subtitle;
    $('bar').className = 'bar' + (v.indeterminate ? ' indet' : '');
    $('bar').firstChild.style.width = v.percent + '%';
    const steps = $('steps'); steps.textContent = '';
    for (const s of v.steps) {
      const li = el('li', 'step ' + s.state);
      li.append(el('span', 'ico', ICON[s.state]));
      const t = el('div', 't'); t.append(el('div', '', s.label));
      if (s.detail) t.append(el('div', 'd', s.detail));
      li.append(t); steps.append(li);
    }
    const svc = $('svc'); svc.textContent = '';
    for (const s of v.services) {
      const li = el('li', s.state);
      li.append(el('span', 'n', s.label), el('span', 's', s.text));
      svc.append(li);
      if (s.detail && s.state !== 'ready') { const w = el('li', 'why', s.detail); w.style.display = 'block'; svc.append(w); }
    }
    $('err').style.display = v.error ? 'block' : 'none';
    $('errmsg').textContent = v.error;
    $('errlog').textContent = v.error ? v.tail.join('\n') : '';
    $('log').textContent = v.error || v.ready ? '' : v.tail.slice(-2).join('\n');
  }

  function go(url) {
    let tries = 0;
    const probe = () => fetch(url + 'healthz', { mode: 'no-cors', cache: 'no-store' })
      .then(() => location.replace(url))
      .catch(() => (++tries < 20 ? setTimeout(probe, 250) : location.replace(url)));
    probe();
  }

  async function poll() {
    try {
      const st = await (await fetch('/status', { cache: 'no-store' })).json();
      misses = 0;
      const v = view(st);
      render(v);
      if (v.ready && v.url && !redirected) { redirected = true; setTimeout(() => go(v.url.endsWith('/') ? v.url : v.url + '/'), 600); }
    } catch (e) {
      if (++misses > 3 && !redirected) $('sub').textContent = 'Waiting for the launcher…';
    }
    setTimeout(poll, 350);
  }
  poll();
}
</script>
</body>
</html>
