<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waifu</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="fallback" hidden>No avatar loaded - drop a .vrm file into <code>/avatars</code>. Chat still works.</div>

  <header>
    <div id="title">…</div>
    <div id="dots" title="service health"></div>
    <select id="avatar-select" title="avatar"></select>
    <button id="mute" title="mute voice">🔊</button>
  </header>

  <div id="toasts"></div>

  <section id="chat">
    <div id="log"></div>
    <form id="composer" autocomplete="off">
      <button type="button" id="mic" title="microphone (hands-free)">🎙</button>
      <input id="text" placeholder="Say something…" maxlength="2000" />
      <button type="submit" id="send">➤</button>
    </form>
  </section>

  <div id="start"><button id="start-btn">Start talking</button><p>Click once so the browser allows audio &amp; microphone.</p></div>
  <script src="/app.js"></script>
</body>
</html>
