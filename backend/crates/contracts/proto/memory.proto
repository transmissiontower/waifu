syntax = "proto3";
package waifu.v1;
import "common.proto";

service Memory {
  rpc Recall(RecallRequest) returns (RecallResponse);
  rpc StoreTurn(StoreTurnRequest) returns (Ack);
  // Extract (and persist) durable facts about the user from one exchange.
  rpc ExtractFacts(ExtractRequest) returns (ExtractResponse);
  rpc ListFacts(ListFactsRequest) returns (ExtractResponse);
  // Force summarization of old messages (also triggered automatically).
  rpc Summarize(SummarizeRequest) returns (SummarizeResponse);
}

message RecallRequest { string user_id = 1; string query = 2; uint32 top_k = 3; uint32 recent = 4; }
message MemoryItem { string text = 1; float score = 2; string kind = 3; int64 ts = 4; }
message Fact { string key = 1; string value = 2; }
message RecallResponse {
  repeated MemoryItem memories = 1;
  repeated Fact facts = 2;
  string summary = 3;
  repeated ChatMessage recent = 4;
}
message StoreTurnRequest { string user_id = 1; string role = 2; string text = 3; }
message ExtractRequest { string user_id = 1; string user_text = 2; string assistant_text = 3; }
message ExtractResponse { repeated Fact facts = 1; }
message ListFactsRequest { string user_id = 1; }
message SummarizeRequest { string user_id = 1; }
message SummarizeResponse { bool summarized = 1; string summary = 2; }
